# ============================================================================
# DeepSeek 配置（部署到 ~/.codex/deepseek.config.toml）
# 用法：codex --profile deepseek
# 需要环境变量 DEEPSEEK_API_KEY（可用 scripts/10-setup-codex.sh 写入 ~/.codex/env）
# ============================================================================
model = "deepseek-flash"
model_provider = "deepseek"
model_reasoning_effort = "high"

[model_providers.deepseek]
name = "DeepSeek"
base_url = "https://api.deepseek.com"
env_key = "DEEPSEEK_API_KEY"
wire_api = "responses"
