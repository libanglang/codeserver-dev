# ============================================================================
# kind 集群：1 控制面 + 2 worker
#   控制面  : <cluster>-control-plane   带 ingress-ready=true，并映射宿主 80/443
#   worker01: <cluster>-worker          标签 vtf.io/worker=worker01
#   worker02: <cluster>-worker2         标签 vtf.io/worker=worker02
#
# Kubernetes 版本通过每个节点的 image 字段固定（kind 就是靠 node 镜像锁版本的）。
# v1.36.4 是 kind v0.33.0 为 K8s 1.36 发布的最新 patch 镜像；带 @sha256 是 kind 官方建议写法，
# 确保拿到的是该 release 编译的镜像。注意：不存在 kindest/node:v1.36.0 这个 tag。
# kind v0.33.0 提供的其它版本：v1.37.0 / v1.36.4 / v1.35.8 / v1.34.11
#
# 创建：kind create cluster --name vtf-dev --config kind/kind-cluster.yaml
# ============================================================================
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: vtf-dev

networking:
  # 关键：把 API Server 固定暴露在宿主(Windows/ WSL)的 127.0.0.1:6443
  # 这样 Windows 上的 Lens 可以直接用 kubeconfig 里的 https://127.0.0.1:6443 连上
  # （Docker Desktop 会把容器发布的端口转发到 Windows localhost）
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"

nodes:
  # ---------------------------------------------------------------- 控制面 ----
  - role: control-plane
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # 把节点容器的 80 映射到宿主(Windows)的 80，ingress-nginx 才能被浏览器访问。
    # 443 没有映射：本机 Windows 上 VMware Workstation Server(vmware-hostd, PID 见 netstat -ano) 已占用 443，
    # 会导致 kind 创建失败（ports are not available: exposing port TCP 0.0.0.0:443）。
    # 本方案只走 http://，所以不需要 443。以后要上 HTTPS 时二选一：
    #   a) 停掉 VMware Workstation Server 服务后，把下面 443 的映射恢复；
    #   b) 换成别的宿主端口（如 hostPort: 8443），并给 Ingress 加 TLS。
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      # - containerPort: 443
      #   hostPort: 443
      #   protocol: TCP

  # ---------------------------------------------------------------- worker01 --
  - role: worker
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "vtf.io/worker=worker01"

  # ---------------------------------------------------------------- worker02 --
  # codeserver-lqm / codeserver-yl / codeserver-zk 都调度到这个节点
  - role: worker
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "vtf.io/worker=worker02"
