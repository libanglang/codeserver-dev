# ============================== 20-ingress.yaml ==============================
# ============================================================================
# ALB Ingress：按路径访问
#   http://codeserver.example.com/dev/group/vtf/lqm/  -> codeserver-lqm:8080(sidecar)
#   http://codeserver.example.com/dev/group/vtf/yl/   -> codeserver-yl:8080(sidecar)
#   http://codeserver.example.com/dev/group/vtf/zk/   -> codeserver-zk:8080(sidecar)
#
# 这里 ALB 只做**最朴素的路径转发**，不做任何重写 —— 前缀剥离和补斜杠都在 Pod 内的
# nginx sidecar 里完成（manifests/ack/12-proxy-config.yaml）。
# 这么做是因为：code-server 4.x 删掉了 --base-path，必须由代理剥前缀；而 ALB 的重写
# 机制和 nginx 的 rewrite-target 注解完全不同（ALB 走"转发动作"），写错很难排查。
# 把逻辑放进 sidecar 后：ALB 侧零特殊配置，行为还可在本地用真实 nginx 验证。
#
# 前置：ACK 集群里要有 ALB Ingress 的 IngressClass（通常叫 alb）。
#   如果还没有，在控制台"路由 → 创建 Ingress"向导走一遍（会自动创建 AlbConfig + IngressClass），
#   然后再 apply 本文件；或者把现成的 AlbConfig 名称写进 IngressClass 里。
#
# 域名：本文件用 codeserver.example.com；解析用 CNAME 指到 ALB 的 DNS 名称。
#      国内公网域名需要备案；只内网用就把 address-type 改成 intranet。
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codeserver
  namespace: vtf-tools
  annotations:
    # 监听端口与你们现有 ALB 配置保持一致（实例上已配 443/HTTPS + 证书）。
    # 注意：ALB 的监听是**实例级**的，写错会把 443 干掉，所以这里显式保留 HTTP+HTTPS。
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/healthcheck-path: /readyz       # 由 sidecar 转发到 code-server 的真实健康端点
    # 不写 address-type：ALB 实例已存在，交给 AlbConfig 管，避免误改实例属性
    # 不要写 backend-protocol: https —— code-server 是 HTTP，写了会导致 ALB 用 HTTPS 连后端失败
spec:
  ingressClassName: alb
  rules:
    - host: codeserver.example.com
      http:
        paths:
          - path: /dev/group/vtf/lqm
            pathType: Prefix
            backend:
              service:
                name: codeserver-lqm
                port:
                  number: 8080
          - path: /dev/group/vtf/yl
            pathType: Prefix
            backend:
              service:
                name: codeserver-yl
                port:
                  number: 8080
          - path: /dev/group/vtf/zk
            pathType: Prefix
            backend:
              service:
                name: codeserver-zk
                port:
                  number: 8080

# ---------------------------------------------------------------------------
# 【重要】关于域名与备案（实测踩到）
#   公网 ALB 的 80 端口会做 ICP 备案校验：域名未备案时，阿里云边缘直接返回
#     403 Forbidden / Server: Beaver / <title>Non-compliance ICP Filing</title>
#   这跟集群配置无关。三种处理方式：
#     a) 给域名做 ICP 备案（企业备案，走阿里云备案系统）—— 之后用 codeserver.example.com 直接访问
#     b) 改用内网 ALB：AlbConfig/Ingress 的 address-type 设为 intranet，走内网/VPN 访问（不需要备案）
#     c) 临时用 ALB 自带域名访问（阿里云自己的域名，已备案）—— 在 rules 里再加一段：
#
#        - host: alb-xxxxxxxxxxxxxxxx.cn-hangzhou.alb.aliyuncsslb.com
#          http:
#            paths:
#              - {path: /dev/group/vtf/lqm, pathType: Prefix, backend: {service: {name: codeserver-lqm, port: {number: 8080}}}}
#              - {path: /dev/group/vtf/yl,  pathType: Prefix, backend: {service: {name: codeserver-yl,  port: {number: 8080}}}}
#              - {path: /dev/group/vtf/zk,  pathType: Prefix, backend: {service: {name: codeserver-zk,  port: {number: 8080}}}}
#
#       （本次验证就是用 c) 的方式跑通的：三条路径分别返回 302，cookie 名分别是
#        code-server-session--lqm / --yl / --zk，证明路由到了正确的 Pod）
# ---------------------------------------------------------------------------
