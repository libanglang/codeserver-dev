# ============================================================================
# 三个开发机各自的登录密码（刻意用简单密码，方便本地开发；想改直接改这里再 apply）
#   lqm -> CHANGE_ME_lqm
#   yl  -> CHANGE_ME_yl
#   zk  -> CHANGE_ME_zk
#
# 为什么要分开：三台共用同一个域名(origin)，浏览器（Chrome 密码管理器）会把
# 同一个 origin 的密码自动填充到三个登录页，导致"没输密码就进去了"的错觉。
# 密码不同 + 各自的 cookie 名不同（--cookie-suffix），才能真正分开。
#
# 生成更安全的密码：
#   kubectl -n dev create secret generic codeserver-passwords \
#     --from-literal=lqm="$(openssl rand -base64 12)" \
#     --from-literal=yl="$(openssl rand -base64 12)" \
#     --from-literal=zk="$(openssl rand -base64 12)" \
#     --dry-run=client -o yaml | kubectl apply -f -
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: codeserver-passwords
  namespace: dev
type: Opaque
stringData:
  lqm: CHANGE_ME_lqm
  yl: CHANGE_ME_yl
  zk: CHANGE_ME_zk
